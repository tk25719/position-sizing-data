[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "position-sizing-data"
version = "0.1.1"
description = "Reference data and arithmetic for risk-based position sizing across forex, stocks and crypto futures"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "JUN YI" }]
keywords = ["position sizing", "risk management", "forex", "trading", "crypto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://positionsizetool.com/"
Repository = "https://github.com/tk25719/position-sizing-data"
Zenodo = "https://doi.org/10.5281/zenodo.22840538"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
position_sizing_data = ["data/*.csv"]
